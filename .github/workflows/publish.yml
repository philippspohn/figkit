name: publish

# Publishes to PyPI when a GitHub Release is published, using Trusted
# Publishing (OIDC) — no API token is stored anywhere. Configure the publisher
# at https://pypi.org/manage/account/publishing/ with:
#
#   PyPI project name : figkit
#   Owner             : philippspohn
#   Repository name   : figkit
#   Workflow name     : publish.yml
#   Environment name  : pypi
#
# Run the workflow manually with `dry_run` to build and check the artefacts
# without uploading anything.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not upload"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e ".[dev]"

      - name: Test
        # A release can be cut from any commit, including one whose CI failed,
        # so re-run the suite here rather than trusting that it was green.
        run: pytest -q

      - name: Verify the tag matches the packaged version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re,pathlib; \
            print(re.search(r'^version = \"(.+?)\"', \
            pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/figkit
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
